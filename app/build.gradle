buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }

}

plugins {
    id 'com.android.application'
}



tasks.register("prepareKotlinBuildScriptModel"){}

android {
    namespace 'com.winlator.cmod'

    compileSdk 34

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 26

        targetSdkVersion 28

        versionCode 20
        versionName "Cmod-v13.1"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }


        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        // If you have a release build type, add it here
    }


    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-8@aar'
    implementation 'org.tukaani:xz:1.12'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.6'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.openjsse:openjsse:1.1.14'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.10.1'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.10.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.android.material:material:1.10.0'
}



